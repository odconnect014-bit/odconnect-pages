<h1>Connected</h1>
<p id="msg">Reading the authorization response&hellip;</p>
<pre id="out" style="background:#f3f3f3;padding:12px;border-radius:6px;white-space:pre-wrap;word-break:break-all;display:none"></pre>
<p id="hint" style="display:none">Copy the text above and paste it where the Tool asks for it. This page stores nothing and sends nothing anywhere; the values appear only in your browser.</p>
<script>
(function(){var q=new URLSearchParams(location.search);var code=q.get('code'),realm=q.get('realmId'),state=q.get('state'),err=q.get('error');
var out=document.getElementById('out'),msg=document.getElementById('msg'),hint=document.getElementById('hint');
if(err){msg.textContent='Intuit returned an error: '+err;return;}
if(!code){msg.textContent='No authorization code found in this address. Start the connection from the Tool and try again.';return;}
msg.textContent='Authorization received. Hand this back to the Tool:';out.style.display='block';hint.style.display='block';
out.textContent='code='+code+'\nrealmId='+(realm||'')+'\nstate='+(state||'');})();
</script>

<footer>ODConnect &middot; app.odconnect.net &middot; Last updated October 2026</footer></body></html>
